services:
  db:
    image: postgres:16-alpine
    container_name: gps-db
    env_file:
      - ./.env.docker.local
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gps_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: gps-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./.env.docker.local
      - ./api/.env
    environment:
      PORT: ${API_PORT:-3002}
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
      NODE_ENV: production
    volumes:
      - ${FIREBASE_SERVICE_ACCOUNT_FILE}:/run/secrets/firebase-service-account.json:ro
    ports:
      - "${API_PORT:-3002}:${API_PORT:-3002}"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${API_PORT:-3002}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-3002}
        VITE_FO_API_BASE_URL: http://localhost:${API_PORT:-3002}
    container_name: gps-frontend
    ports:
      - "4174:80"
    depends_on:
      - api
    environment:
      - API_BASE_URL=http://api:${API_PORT:-3002}
    restart: unless-stopped

volumes:
  pgdata:
