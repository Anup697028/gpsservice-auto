<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "brand-orange": "#f26a21",
                        "background-light": "#f8f6f6",
                        "background-dark": "#221610",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
        }
        /* Overriding bold as requested: sharp black non-bold typography */
        .non-bold {
            font-weight: 400 !important;
        }
    </style>
</head>
<body class="bg-slate-200 dark:bg-background-dark min-h-screen flex items-center justify-center p-4">
<!-- Modal Container -->
<div class="relative w-full max-w-[600px] bg-white dark:bg-background-dark rounded-xl shadow-2xl overflow-hidden border border-slate-200 dark:border-primary/20">
<!-- Header -->
<header class="flex items-center justify-between border-b border-slate-100 dark:border-primary/10 px-6 py-4">
<h2 class="text-brand-orange text-xl non-bold tracking-tight">Reject Request</h2>
<button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</header>
<!-- Summary Section -->
<div class="px-6 py-4 bg-slate-50 dark:bg-primary/5 grid grid-cols-2 gap-y-4 gap-x-8 border-b border-slate-100 dark:border-primary/10">
<div class="flex flex-col gap-1">
<p class="text-slate-500 text-xs uppercase tracking-wider non-bold">Request ID</p>
<p class="text-slate-900 dark:text-slate-100 text-sm non-bold">#GPS-8821</p>
</div>
<div class="flex flex-col gap-1">
<p class="text-slate-500 text-xs uppercase tracking-wider non-bold">Client</p>
<p class="text-slate-900 dark:text-slate-100 text-sm non-bold">Global Logistics Corp</p>
</div>
<div class="flex flex-col gap-1">
<p class="text-slate-500 text-xs uppercase tracking-wider non-bold">City</p>
<p class="text-slate-900 dark:text-slate-100 text-sm non-bold">San Francisco</p>
</div>
<div class="flex flex-col gap-1">
<p class="text-slate-500 text-xs uppercase tracking-wider non-bold">Status</p>
<p class="text-slate-900 dark:text-slate-100 text-sm non-bold">Pending Review</p>
</div>
<div class="flex flex-col gap-1">
<p class="text-slate-500 text-xs uppercase tracking-wider non-bold">Vehicle Count</p>
<p class="text-slate-900 dark:text-slate-100 text-sm non-bold">24 Units</p>
</div>
</div>
<!-- Input Section -->
<div class="p-6 flex flex-col gap-4">
<div class="flex flex-col gap-2">
<label class="text-brand-orange text-sm non-bold">Rejection Reason <span class="text-red-500">*</span></label>
<textarea class="w-full min-h-[140px] p-4 rounded-lg border border-slate-200 dark:border-primary/30 focus:ring-1 focus:ring-brand-orange focus:border-brand-orange bg-white dark:bg-transparent text-slate-900 dark:text-slate-100 text-sm non-bold resize-none" placeholder="Provide a detailed reason for rejecting this installation request..."></textarea>
<div class="flex justify-between items-center mt-1">
<p class="text-slate-400 text-xs non-bold italic">Minimum 20 characters required.</p>
<p class="text-slate-400 text-xs non-bold">0 / 500</p>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="px-6 py-6 flex flex-col sm:flex-row-reverse gap-3 border-t border-slate-100 dark:border-primary/10">
<button class="w-full sm:w-auto px-8 py-2.5 bg-brand-orange hover:bg-orange-600 text-white rounded-lg transition-colors text-sm non-bold uppercase tracking-widest shadow-lg shadow-brand-orange/20">
                Confirm Reject
            </button>
<button class="w-full sm:w-auto px-8 py-2.5 border border-slate-300 dark:border-primary/40 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-primary/10 rounded-lg transition-colors text-sm non-bold uppercase tracking-widest">
                Cancel
            </button>
</div>
</div>
</body></html>
