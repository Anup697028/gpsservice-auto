apiVersion: apps/v1
kind: Deployment
metadata:
  name: gps-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gps-api
  template:
    metadata:
      labels:
        app: gps-api
    spec:
      containers:
      - name: api
        image: placeholder-api:latest
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "3002"
        - name: NODE_ENV
          value: "production"
        ports:
        - containerPort: 3002
